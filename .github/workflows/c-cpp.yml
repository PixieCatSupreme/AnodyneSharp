name: Anodyne C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: make build dir
      run: mkdir build
    - name: cd into build dir
      run: cd build  
    - name: cmake
      run: cmake ..
    - name: make
      run: make
